name: Deploy BroncoCircle to GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - 'broncocircle/**'
      - 'frontend/login/**'
      - 'scripts/build-pages.mjs'
      - '.github/workflows/pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Verify website files
        run: |
          test -s broncocircle/index.html
          test -s broncocircle/styles.css
          test -s broncocircle/app.js
          test -s frontend/login/index.html
          test -s frontend/login/login.js
          test -d broncocircle/assets
          test -n "$(find broncocircle/assets -type f -print -quit)"
      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Prepare website and teammate login
        id: site
        env:
          LIVE_APP_URL: ${{ vars.LIVE_APP_URL }}
        run: node scripts/build-pages.mjs
      - name: Upload static site
        uses: actions/upload-pages-artifact@v3
        with:
          # Contains broncocircle at the root, login/, and optional live routing.
          path: ${{ steps.site.outputs.path }}
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
